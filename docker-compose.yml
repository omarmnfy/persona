services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: role_rooms
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/role_rooms
      SESSION_SECRET: change-me
      APP_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  db_data:
