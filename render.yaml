services:
  - type: web
    name: persona-web
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: persona-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: persona-db
    plan: free
